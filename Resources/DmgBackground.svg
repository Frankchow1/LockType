<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCFE"/>
      <stop offset="1" stop-color="#EFEFF3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 Z" fill="#0A84FF"/>
    </marker>
    <style>
      .zh { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
    </style>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>

  <!-- 顶部：安装指引 -->
  <text class="zh" x="320" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#1D1D1F">安装 LockType</text>
  <text class="zh" x="320" y="74" text-anchor="middle" font-size="14" fill="#6E6E73">把左边图标拖到右边「应用程序」文件夹即可</text>

  <!-- 拖拽箭头（图标由 Finder 盖在 155,175 与 485,175） -->
  <line x1="232" y1="178" x2="402" y2="178" stroke="#0A84FF" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text class="zh" x="318" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#0A84FF">拖到这里</text>

  <!-- 首次打开提示框 -->
  <rect x="38" y="250" width="564" height="158" rx="16" fill="#FFF6DA" stroke="#EBC76A" stroke-width="1.5"/>
  <text class="zh" x="62" y="288" font-size="15.5" font-weight="700" fill="#8A5A00">⚠️ 首次打开被系统拦住是正常的（未公证），只需处理一次：</text>
  <text class="zh" x="62" y="322" font-size="15" font-weight="700" fill="#1D1D1F">系统设置 → 隐私与安全性 → 滑到底，点「仍要打开」</text>
  <text class="zh" x="62" y="352" font-size="13.5" fill="#6E6E73">（macOS 14 及以下：右键 App → 打开 → 再点「打开」）</text>
  <text class="zh" x="62" y="384" font-size="13.5" fill="#6E6E73">想用终端一键命令？打开本窗口里的说明 .txt 复制即可 ↓</text>
</svg>
